<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stray Legends Stats</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">

        <!-- Header -->
        <header class="top-header">

            <div class="logo">
                <h1>Stray Legends</h1>
            </div>

            <button class="menu-button" id="menuButton">
                ☰
            </button>

        </header>

        <!-- Primary Navigation -->
        <nav class="main-navigation">

            <button class="nav-button active" data-page="stats">
                Stats
            </button>

            <button class="nav-button" data-page="lme">
                LME
            </button>

            <button class="nav-button" data-page="cx">
                CX
            </button>

            <button class="nav-button" data-page="enders-echo">
                Ender's Echo
            </button>

        </nav>

        <!-- Secondary Menu -->
        <div class="menu-dropdown" id="menuDropdown">

            <a href="#">Clan ID: 24273</a>
            <a href="#">About</a>

        </div>

        <!-- Main Content -->
        <main class="main-content">

            <section class="page-content active" id="stats">

                <h1>Overall Clan Stats</h1>
                
                <div class="stats-grid">

                    <div class="stat-card">
                        <p>Total Members</p>
                        <h2 id="totalMembers">0</h2>
                    </div>

                    <div class="stat-card">
                        <p>Total ATK</p>
                        <h2 id="totalATK">0</h2>
                    </div>

                    <div class="stat-card">
                        <p>Avg ATK</p>
                        <h2 id="avgATK">0</h2>
                    </div>

                    <div class="stat-card">
                        <p>Total Relic Cores</p>
                        <h2 id="totalRelicCores">0</h2>
                    </div>

                </div>

            </section>

            <section class="page-content" id="lme">
                <h1>Lunar Mine Expedition</h1>
                <p>LME player statistics and rankings.</p>
            </section>

            <section class="page-content" id="cx">
                <h1>Cosmic Expedition</h1>
                <p>CX player statistics and rankings.</p>
            </section>

            <section class="page-content" id="enders-echo">
                <h1>Ender's Echo</h1>
                <p>Ender's Echo player statistics and rankings.</p>
            </section>

        </main>

    </div>

    <script src="js/main.js"></script>
</body>
</html>
